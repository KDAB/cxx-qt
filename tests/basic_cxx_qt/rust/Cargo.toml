[package]
name = "basic_cxx_qt"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib"]

[features]
# See src/cfgs.rs: whichever way this feature is set, one of the two QObjects of
# that bridge is compiled out, which is the case that used to fail to compile.
cfg_enabled = []

[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cxx-qt-build.workspace = true
